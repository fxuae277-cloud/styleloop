<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - StyleLoop</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="assets/js/nav.js"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #FAFAF8; color: #2A2A2A; line-height: 1.7; }
        .page-wrap { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }
        h1 { font-size: 2rem; font-weight: 800; color: #E91E63; margin-bottom: 1.5rem; }
        h2 { font-size: 1.15rem; font-weight: 700; color: #2A2A2A; margin: 1.5rem 0 .8rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card {
            background: #fff; border-radius: 16px; padding: 1.3rem;
            border: 1px solid #F0E8EA; box-shadow: 0 2px 10px rgba(0,0,0,.04);
            text-align: center;
        }
        .stat-card .label { font-size: .8rem; color: #999; margin-bottom: .4rem; }
        .stat-card .value { font-size: 1.8rem; font-weight: 800; color: #E91E63; font-family: 'Poppins', sans-serif; }
        section { background: #fff; border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid #F0E8EA; }
        label { display: inline-block; width: 80px; font-weight: 600; font-size: .9rem; }
        input[type="number"] {
            padding: .4rem .8rem; border: 1.5px solid #F8BBD0; border-radius: 8px;
            font-family: 'Cairo', sans-serif; font-size: .9rem; outline: none; width: 140px;
        }
        input[type="number"]:focus { border-color: #E91E63; }
        .meas-row { display: flex; align-items: center; gap: .8rem; margin-bottom: .7rem; flex-wrap: wrap; }
        button.edit-btn {
            padding: .35rem .9rem; background: #FCE4EC; border: none; border-radius: 8px;
            color: #E91E63; font-family: 'Cairo', sans-serif; font-weight: 700; cursor: pointer; font-size: .82rem;
        }
        button.edit-btn:hover { background: #E91E63; color: #fff; }
    </style>
</head>
<body>
    <!-- shared nav injected by assets/js/nav.js -->
    <div class="page-wrap">
        <h1>👤 لوحة التحكم</h1>
        <div class="stats-grid">
            <div class="stat-card"><div class="label">عناصر نشطة</div><div class="value" id="active-items">0</div></div>
            <div class="stat-card"><div class="label">إجمالي المبيعات</div><div class="value" id="total-sales">0</div></div>
            <div class="stat-card"><div class="label">المعاملات</div><div class="value" id="transactions">0</div></div>
            <div class="stat-card"><div class="label">الدقة</div><div class="value" id="accuracy">0%</div></div>
        </div>

        <section class="recent-activity">
            <h2>النشاط الأخير</h2>
            <ul id="activity-list">
                <li style="color:#999;font-size:.9rem">لا توجد أنشطة بعد.</li>
            </ul>
        </section>

        <section class="items-for-sale">
            <h2>المنتجات المعروضة للبيع</h2>
            <div class="grid" style="color:#999;font-size:.9rem">لا توجد منتجات بعد. <a href="sell.html" style="color:#E91E63;font-weight:700">أضيفي الآن</a></div>
        </section>

        <section class="measurements">
            <h2>مقاساتك</h2>
            <div class="meas-row">
                <label for="height">الطول:</label>
                <input type="number" id="height" placeholder="سم">
                <button class="edit-btn" onclick="editMeasurement('height')">حفظ</button>
            </div>
            <div class="meas-row">
                <label for="weight">الوزن:</label>
                <input type="number" id="weight" placeholder="كغ">
                <button class="edit-btn" onclick="editMeasurement('weight')">حفظ</button>
            </div>
            <div class="meas-row">
                <label for="chest">الصدر:</label>
                <input type="number" id="chest" placeholder="سم">
                <button class="edit-btn" onclick="editMeasurement('chest')">حفظ</button>
            </div>
            <div class="meas-row">
                <label for="waist">الخصر:</label>
                <input type="number" id="waist" placeholder="سم">
                <button class="edit-btn" onclick="editMeasurement('waist')">حفظ</button>
            </div>
        </section>
    </div>
    <script>
        function editMeasurement(measurement) {
            const value = document.getElementById(measurement).value;
            if (value) alert('تم حفظ ' + measurement + ': ' + value);
        }
    </script>
</body>
</html>
