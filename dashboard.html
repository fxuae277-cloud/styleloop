    <div class="user-stats">
        <div class="card active-items">Active Items: <span id="active-items">0</span></div>
        <div class="card total-sales">Total Sales: <span id="total-sales">0</span></div>
        <div class="card transactions">Transactions: <span id="transactions">0</span></div>
        <div class="card accuracy">Accuracy: <span id="accuracy">0%</span></div>
    </div>

    <section class="recent-activity">
        <h2>Recent Activity</h2>
        <ul id="activity-list">
            <!-- Activity items will go here -->
        </ul>
    </section>

    <section class="items-for-sale">
        <h2>Items for Sale</h2>
        <div class="grid">
            <!-- Items for sale will go here -->
        </div>
    </section>

    <section class="measurements">
        <h2>Your Measurements</h2>
        <div>
            <label for="height">Height:</label>
            <input type="number" id="height" placeholder="Enter height" />
            <button onclick="editMeasurement('height')">Edit</button>
        </div>
        <div>
            <label for="weight">Weight:</label>
            <input type="number" id="weight" placeholder="Enter weight" />
            <button onclick="editMeasurement('weight')">Edit</button>
        </div>
        <div>
            <label for="chest">Chest:</label>
            <input type="number" id="chest" placeholder="Enter chest size" />
            <button onclick="editMeasurement('chest')">Edit</button>
        </div>
        <div>
            <label for="waist">Waist:</label>
            <input type="number" id="waist" placeholder="Enter waist size" />
            <button onclick="editMeasurement('waist')">Edit</button>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Your Company. All rights reserved.</p>
    </footer>
    <script>
        function editMeasurement(measurement) {
            const value = document.getElementById(measurement).value;
            console.log(`Updated ${measurement}: ${value}`);

        }
    </script>
